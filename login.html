<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Examination Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-page">
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #8B0000;">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
                <img src="assets/images/logo.png" alt="Arya College Logo" style="height: 50px; width: auto; margin-right: 15px;">
                <span>Examination Portal</span>
            </a>
        </div>
    </nav>

    <!-- Login Container -->
    <div class="login-container">
        <div class="container">
            <div class="row justify-content-center min-vh-100 align-items-center">
                <div class="col-md-8 col-lg-5">
                    <div class="login-card fade-in">
                        <!-- Header -->
                        <div class="text-center mb-4">
                            <h2 class="text-center" style="color: #1a1a4d; font-family: 'Poppins', sans-serif; font-weight: 700;">Student Login</h2>
                            <p class="text-muted small">Arya College of Engineering & I.T.</p>
                        </div>

                        <!-- Login Form -->
                        <form id="loginForm">
                            <!-- Username -->
                            <div class="mb-3">
                                <label for="username" class="form-label" style="font-weight: 600; color: #1a1a4d;">Enrollment Number / Roll No.</label>
                                <div class="input-group">
                                    <span class="input-group-text" style="background-color: #f0f0f0; border: 1px solid #e0e0e0;">
                                        <i class="fas fa-id-card" style="color: #8B0000;"></i>
                                    </span>
                                    <input type="text" class="form-control" id="username" placeholder="Enter your Enrollment Number / Roll Number" required>
                                </div>
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label for="password" class="form-label" style="font-weight: 600; color: #1a1a4d;">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text" style="background-color: #f0f0f0; border: 1px solid #e0e0e0;">
                                        <i class="fas fa-lock" style="color: #8B0000;"></i>
                                    </span>
                                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Remember Me & Forgot Password -->
                            <div class="row mb-4">
                                <div class="col-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="rememberMe">
                                        <label class="form-check-label" for="rememberMe">Remember me</label>
                                    </div>
                                </div>
                                <div class="col-6 text-end">
                                    <a href="#" class="small text-decoration-none" style="color: #8B0000;">Forgot Password?</a>
                                </div>
                            </div>

                            <!-- Login Button -->
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-600 mb-3" id="loginBtn" style="background-color: #8B0000; border-color: #8B0000; font-size: 1.05rem;">
                                <i class="fas fa-sign-in-alt me-2"></i>Login to Dashboard
                            </button>

                            <a href="index.html" class="btn btn-outline-secondary w-100 py-2">
                                <i class="fas fa-arrow-left me-2"></i>Back to Home
                            </a>
                        </form>
                    </div>

                    <!-- Footer Text -->
                    <div class="text-center mt-4">
                        <p class="text-muted small">
                            &copy; 2026 Arya College of Engineering & I.T. All rights reserved.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
    <script>
        // Toggle Password Visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // Login Form Handler
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (username && password) {
                // Store username for dashboard display
                sessionStorage.setItem('studentUsername', username);
                sessionStorage.setItem('isLoggedIn', 'true');
                
                // Redirect to dashboard
                window.location.href = 'dashboard.html';
            } else {
                alert('Please enter both username and password');
            }
        });
    </script>
</body>
</html>
